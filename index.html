<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OS_FIT Diario</title>
  <meta name="description" content="Diario dei pasti personale per OS_FIT. Funziona offline, i dati restano sul telefono.">
  <meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1311" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OS_FIT Diario">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>try { const t = localStorage.getItem('osfit-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icone (tratto 24×24, un solo stile per tutta l'app) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5H12z" fill="currentColor" stroke="none" opacity=".25"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="6" width="3" height="11" rx="1"/><rect x="15.5" y="9" width="3" height="8" rx="1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><path d="M8 9v6M11 9v6M13.5 9v6M16 9v6"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.8 2.5 5.1 5.6.8-4 3.9 1 5.6-5.1-2.6-5 2.6 1-5.6-4.1-3.9 5.6-.8z"/></symbol>
    <symbol id="i-dish" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3.5"/><path d="M3 5v4M5 5v4M4 9v11M20 5c-1.5 1-2 3-2 5h2v10"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 10a5 5 0 0 1 7 0L13 12.5"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21c3.9 0 6.5-2.6 6.5-6.2 0-3.8-3.2-6.2-4-9.8-2.6 1.5-3.7 4.1-3.4 6.5-1.3-.6-2-2-2.1-3.1C7.3 9.9 5.5 12 5.5 14.8 5.5 18.4 8.1 21 12 21z"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-13 0 9-5 14-13 14z"/><path d="M5 19c3-4 6-6.5 9.5-8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.2v.3"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-torch" viewBox="0 0 24 24"><path d="M8 3h8v4l-2 3v11h-4V10L8 7z"/><path d="M12 13v2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.8v.3"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 8.5l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-m1" viewBox="0 0 24 24"><path d="M5 10h11v4a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5c0 1.2 1 1.5 1 3M11.5 3.5c0 1.2 1 1.5 1 3"/></symbol>
    <symbol id="i-m2" viewBox="0 0 24 24"><path d="M12 8c-3-2-7-1-7 4 0 4 3 8 5 8 1 0 1.3-.5 2-.5s1 .5 2 .5c2 0 5-4 5-8 0-5-4-6-7-4z"/><path d="M12 8c0-2 1-3.5 3-4.5"/></symbol>
    <symbol id="i-m3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/></symbol>
    <symbol id="i-m4" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="9" cy="10" r=".9" fill="currentColor"/><circle cx="14.5" cy="9" r=".9" fill="currentColor"/><circle cx="14" cy="14.5" r=".9" fill="currentColor"/><circle cx="9.5" cy="15" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-m5" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></symbol>
  </svg>

  <header class="top">
    <span class="brand"><span class="logo"><svg class="ic"><use href="#i-flame"/></svg></span>OS_FIT <em>Diario</em></span>
    <span class="ver" id="ver"></span>
  </header>

  <div id="update" class="update" hidden>
    <span>Nuova versione disponibile</span>
    <button class="btn small" data-act="apply-update">Aggiorna</button>
  </div>

  <main>
    <section id="view-oggi" class="view" aria-label="Oggi" aria-busy="true">
      <div class="skel" style="height:40px;margin-top:6px"></div>
      <div class="skel" style="height:164px;border-radius:24px"></div>
      <div class="skel" style="height:64px"></div><div class="skel" style="height:64px"></div><div class="skel" style="height:64px"></div>
    </section>
    <section id="view-alimenti" class="view" aria-label="Alimenti" hidden></section>
    <section id="view-settimana" class="view" aria-label="Progressi" hidden></section>
  </main>

  <button class="fab" id="fab" data-act="quick-add" aria-label="Aggiungi un alimento" hidden><svg class="ic"><use href="#i-plus"/></svg><span>Aggiungi</span></button>

  <nav class="tabs" aria-label="Schermate">
    <button data-act="tab" data-view="oggi" aria-current="page"><span class="pill"><svg class="ic"><use href="#i-today"/></svg></span>Oggi</button>
    <button data-act="tab" data-view="alimenti"><span class="pill"><svg class="ic"><use href="#i-food"/></svg></span>Alimenti</button>
    <button data-act="tab" data-view="settimana"><span class="pill"><svg class="ic"><use href="#i-chart"/></svg></span>Progressi</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="backdrop" data-act="close-sheet"></div>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="panel-head">
        <h2 id="sheet-title"></h2>
        <button class="icon" data-act="close-sheet" aria-label="Chiudi"><svg class="ic sm"><use href="#i-close"/></svg></button>
      </div>
      <div class="panel-body" id="sheet-body"></div>
    </div>
  </div>

  <input type="file" id="restore-file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">OS_FIT Diario richiede JavaScript.</p></noscript>
  <script src="catalog.js"></script>
  <script src="scanner.js"></script>
  <script src="app.js"></script>
</body>
</html>
